<section id="taste" hidden>
    <button class="back" data-go="profile">← Profile</button>
    <h2 class="ph">Your taste</h2>
    <div class="row tzkinds" id="tzKinds">
      <button class="chip" data-v="anime" aria-pressed="true">Anime</button>
      <button class="chip" data-v="manga" aria-pressed="false">Manga</button>
    </div>
    <div id="tzBody"></div>
    <div id="tzShare" class="tzsheet" role="dialog" aria-modal="true" aria-labelledby="tzShareT" hidden>
      <div class="tzsbox">
        <h3 id="tzShareT">Taste report</h3>
        <img id="tzShareImg" alt="Preview of your taste report picture">
        <button class="tzsopt" id="tzShareDo">Share image</button>
        <button class="tzsopt" id="tzCopyDo">Copy image</button>
        <button class="tzsopt" id="tzSaveDo">Save image</button>
        <button class="tzsopt tzcancel" id="tzShareX">Cancel</button>
      </div>
    </div>
  </section>
