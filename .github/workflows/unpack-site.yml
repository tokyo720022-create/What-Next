name: Unpack site.zip
on:
  push:
    paths: ["site.zip"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack into folders
        run: |
          test -f site.zip || { echo "site.zip was not found in the repo root"; exit 1; }
          # site.zip may only carry app files. Anything that could change the build, the signing check or the workflows, or that points outside the repo, is refused.
          if unzip -Z1 site.zip | grep -E '(^|/)\.\.(/|$)|^/|^\.github/|^android-signing/|^package(-lock)?\.json$|^capacitor\.config\.json$|^build-apk\.yml$'; then
            echo "::error::site.zip holds files this workflow does not unpack (listed above). Change those by hand in GitHub."; exit 1
          fi
          rm -f js-*.js css-*.css view-*.html icon.svg
          unzip -o site.zip
          rm site.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site.zip" || echo "Nothing to commit"
          git push
      - name: Start the APK build if this repo has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml || true
