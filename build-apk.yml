name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site.zip"]   # a pushed site.zip is unpacked first; the unpack workflow then starts this build
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  checks:
    # The quick tests run first. If one fails, no APK is built or published, so a broken change never reaches your phone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quick checks
        run: |
          node tests/check-structure.js
          for t in tests/unit/*.test.js; do echo "== $t"; node "$t" || exit 1; done
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check plugins are listed
        run: |
          grep -q '"@capacitor/app"' package.json || { echo "package.json is missing @capacitor/app. Upload the new package.json."; exit 1; }
          grep -q '"@capacitor/browser"' package.json || { echo "package.json is missing @capacitor/browser. Upload the new package.json."; exit 1; }
      - name: Install dependencies (the exact versions in package-lock.json, once that file exists)
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Save package-lock.json the first time, so every later build uses the same versions
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Add package-lock.json (exact dependency versions)" && git push || echo "::warning::Could not save package-lock.json. Add the file to the repo by hand so builds use fixed versions."
          fi
      - name: Show the versions this build uses
        run: npm ls --depth=0 || true
      - run: mkdir -p www && cp -r index.html boot.js css js views assets www/ && (cp config.js www/ || true)
      - run: npx cap add android
      - name: Generate app icon and splash screen
        run: npx --yes @capacitor/assets@3 generate --android --assetPath resources --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#0A0714' --splashBackgroundColorDark '#0A0714' || echo "Icon generation failed. The build continues with the default icon."
      - name: Work out the version of this build
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "name=$BASE-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Minutes since 2023-11-14. It only ever goes up, even if the run counter is ever reset, so Android never sees a downgrade.
          echo "code=$(( ($(date +%s) - 1700000000) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Sign with your secret key and set the version, so a new APK installs over the old one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash android-signing/patch-android.sh "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}"
      - name: Add login deep link
        run: |
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="whatnext"/></intent-filter></activity>#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="whatnext"' android/app/src/main/AndroidManifest.xml || { echo "The login deep link was not added to AndroidManifest.xml"; exit 1; }
      - run: npx cap sync android
      - name: Build the APK (a release build, or a debug build if that fails)
        id: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if ./gradlew assembleRelease; then
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The release build failed (see the error above), so a debug build was made instead. A debug APK can be inspected on the phone, so fix the release build when you can."
            ./gradlew assembleDebug
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the APK has the shared signing key and the right version
        id: fp
        run: |
          bash android-signing/verify-apk.sh "${{ steps.build.outputs.apk }}" "${{ steps.ver.outputs.code }}" "${{ steps.ver.outputs.name }}"
          echo "key=$(tr -d ' \n' < android-signing/fingerprint.txt)" >> "$GITHUB_OUTPUT"
      - name: Name the APK
        run: cp "${{ steps.build.outputs.apk }}" "WhatNext-v${{ steps.ver.outputs.name }}.apk"
      - name: Publish a new release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: What Next? v${{ steps.ver.outputs.name }}${{ steps.build.outputs.kind == 'debug' && ' (debug build, do not install)' || '' }}
          prerelease: ${{ steps.build.outputs.kind == 'debug' }}   # a debug build is never offered as the latest release
          target_commitish: ${{ github.sha }}
          body: "Installs over the previous version: same signing key (SHA-256 ${{ steps.fp.outputs.key }}), version code ${{ steps.ver.outputs.code }}, ${{ steps.build.outputs.kind }} build.${{ steps.build.outputs.kind == 'debug' && ' DEBUG BUILD: the release build failed, so do not install this one. Wait for the next release.' || '' }}"
          generate_release_notes: true
          make_latest: ${{ steps.build.outputs.kind == 'release' }}
          files: WhatNext-v${{ steps.ver.outputs.name }}.apk
