<section id="seasonal" hidden>
    <button class="back" data-go="discover">← Discover</button>
    <h2 class="ph">Seasonal Chart</h2>
    <div class="dbar" id="szBar">
      <button class="chip" id="szYear"><small>Year</small> <span>2026</span></button>
      <button class="chip" id="szSeason"><small>Season</small> <span>Fall</span></button>
      <button class="chip" id="szSort"><small>Sort</small> <span>Popularity</span></button>
      <button class="chip" id="szOrder"><small>Order by</small> <span>Descending</span></button>
      <button class="chip" id="szHide" aria-pressed="false">Hide series on my list</button>
      <button class="chip" id="szOnly" aria-pressed="false">Only show series on my list</button>
    </div>
    <p class="sub" id="szCount"></p>
    <div id="szList"></div>
  </section>
